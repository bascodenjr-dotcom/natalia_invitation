<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aya's Birthday Invitation</title>

    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }

      iframe {
        width: 100%;
        height: 100%;
        border: none;
      }

      /* Music button */
      #musicControl {
        position: fixed;
        right: 20px;
        bottom: 20px;
        z-index: 99999;

        padding: 12px 18px;
        border: none;
        border-radius: 25px;

        background: #d6336c;
        color: white;

        font-weight: bold;
        cursor: pointer;
      }
    </style>
  </head>

  <body>
    <!-- YOUR EXISTING INDEX PAGE -->
    <iframe src="index.html" name="ayaPages"> </iframe>

    <!-- ONE MUSIC PLAYER -->
    <audio id="birthdayMusic" loop>
      <source src="happy-birthday.mp3" type="audio/mpeg" />
    </audio>

    <button id="musicControl" onclick="toggleMusic()">🎵 Play Music</button>

    <script>
      const music = document.getElementById("birthdayMusic");

      function startMusic() {
        if (music.paused) {
          music.play().catch(() => {});
        }
      }

      function toggleMusic() {
        if (music.paused) {
          music.play().catch(() => {});
        } else {
          music.pause();
        }
      }
    </script>
  </body>
</html>
