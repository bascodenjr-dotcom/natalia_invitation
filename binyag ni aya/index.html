<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Aya's 1st Birthday & Baptism</title>
    <!doctype html>

    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }

      iframe {
        width: 100%;
        height: 100%;
        border: none;
      }

      #musicControl {
        position: fixed;
        right: 20px;
        bottom: 20px;
        z-index: 99999;

        padding: 12px 18px;
        border: none;
        border-radius: 25px;

        background: #d6336c;
        color: white;

        font-weight: bold;
        cursor: pointer;
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
      }
    </style>
  </head>

  <body>
    <!-- WEBSITE PAGES -->
    <iframe src="home.html" name="ayaPages" id="ayaPages"> </iframe>

    <!-- MUSIC -->
    <audio id="birthdayMusic" loop>
      <source src="happy-birthday.mp3" type="audio/mpeg" />
    </audio>

    <button id="musicControl" onclick="toggleMusic()">🎵 Play Music</button>

    <script>
      const music = document.getElementById("birthdayMusic");
      const musicButton = document.getElementById("musicControl");

      function startMusic() {
        music
          .play()
          .then(() => {
            musicButton.innerHTML = "🔊 Music ON";
          })
          .catch((error) => {
            console.log("Music could not start:", error);
          });
      }

      function toggleMusic() {
        if (music.paused) {
          music.play().then(() => {
            musicButton.innerHTML = "🔊 Music ON";
          });
        } else {
          music.pause();
          musicButton.innerHTML = "🔇 Music OFF";
        }
      }
    </script>
  </body>
</html>
